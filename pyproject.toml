[project]
name = "kin"
version = "0.1.0"
description = "Voice-first care companion for older adults living alone"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "httpx>=0.28",
    "mcp>=1.20",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
kin-mcp = "kin.mcp_server:main"
